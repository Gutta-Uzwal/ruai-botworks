name: UAT gate

on:
  push:
    branches:
      - uat

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate company source of truth
        run: python3 scripts/company.py
      - name: Validate governance genome
        run: python3 scripts/genome.py --validate

  promote:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Promote UAT to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          pr_number="$(gh pr list --repo "$GH_REPO" --base main --head uat --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head uat \
              --title "Promote UAT to main" \
              --body "Automated promotion after the UAT gate passed.")"
            pr_number="$(gh pr view "$pr_url" --repo "$GH_REPO" --json number --jq '.number')"
          fi
          gh pr merge "$pr_number" --repo "$GH_REPO" --merge --delete-branch=false
