# RU-AIBOTWORKS — tool registry
#
# STD-AGENT-001 §10: every tool carries a complete contract before it may be invoked.
# An unregistered tool is unreachable. An incomplete contract is treated as Tier 3
# and denied by default.
#
# §23 tiers:  0 read · 1 cheap-undo · 2 restore-to-undo · 3 no-undo · 4 escapes boundary
#
# Two rules visible in the shape of this file:
#   A1.4 — there is no hard-delete verb here. Agents get soft-delete and tombstones.
#          Physical deletion runs later under the reaper identity, which no agent
#          can assume.
#   §10.1 — read and write are separate tools, always. Never one tool with a mode flag.

version: 1

# log_before_state is true on every tool, reads included. A read changes no state,
# but reads are exactly how untrusted content enters a context window, and §6.2
# says the only question that matters during an incident is which content steered
# the agent. That is unanswerable if reads are unlogged.

egress:
  default: deny            # A1.3 — including DNS. An empty allowlist fails closed.
  allowlist: []            # specific hosts only, never broad domains
  note: >-
    Tool-mediated publication counts as egress. A tool that writes somewhere
    world-readable is an outbound channel regardless of what it is called.

# Identities an agent may never assume. Enforced at the identity plane, restated
# here so the registry is self-describing.
forbidden_identities:
  - backup-operator        # A1.2 — no direct, transitive or assumed path to backups
  - reaper                 # physical deletion
  - control-plane-operator # A1.5 — the kill switch is out of band

tools:

  # ═══════════════════ Tier 0 — read only ═══════════════════
  - name: repository.read
    version: 1
    owner: platform-engineering
    description: Read a file from the bound repository.
    irreversibility: 0
    side_effects: []
    idempotent: true
    rollback: none
    scope: { resource_pattern: "repository:{repository_id}/read-only" }
    limits: { per_task: 400, per_agent_hour: 4000, mutation_budget: 0 }
    gates: { approval: none, blocked_if: [] }
    evidence: { log_before_state: true,  retention_days: 2555 }

  - name: repository.search
    version: 1
    owner: platform-engineering
    description: Search file contents in the bound repository.
    irreversibility: 0
    side_effects: []
    idempotent: true
    rollback: none
    scope: { resource_pattern: "repository:{repository_id}/read-only" }
    limits: { per_task: 400, per_agent_hour: 4000, mutation_budget: 0 }
    gates: { approval: none, blocked_if: [] }
    evidence: { log_before_state: true,  retention_days: 2555 }

  - name: observability.read
    version: 1
    owner: site-reliability
    description: Read traces, metrics and the trajectory log.
    irreversibility: 0
    side_effects: []
    idempotent: true
    rollback: none
    scope: { resource_pattern: "observability:{tenant_id}/read-only" }
    limits: { per_task: 200, per_agent_hour: 2000, mutation_budget: 0 }
    gates: { approval: none, blocked_if: [] }
    evidence: { log_before_state: true,  retention_days: 2555 }
    note: >-
      Read only, and the observability store is written under a different principal.
      No agent may alter or delete it (§5 plane 7).

  - name: database.query
    version: 1
    owner: data-and-ai
    description: Run a read-only SELECT against a bound database.
    irreversibility: 0
    side_effects: []
    idempotent: true
    rollback: none
    scope:
      resource_pattern: "database:{tenant_id}/{database_name}/read-only"
      requires_referential_check: [database_name]
    limits: { per_task: 100, per_agent_hour: 1000, mutation_budget: 0 }
    gates: { approval: none, blocked_if: [] }
    evidence: { log_before_state: true,  retention_days: 2555 }

  # ═══════════════════ Tier 1 — reversible, cheap ═══════════════════
  - name: repository.write
    version: 1
    owner: platform-engineering
    description: Write a file in the agent's workspace branch.
    irreversibility: 1
    side_effects: [workspace contents change]
    idempotent: true
    rollback: "git checkout -- <path>"
    scope: { resource_pattern: "repository:{repository_id}/workspace/{branch}" }
    limits: { per_task: 100, per_agent_hour: 800, mutation_budget: 100 }
    gates:
      approval: none
      blocked_if: [change_freeze.active, target.is_agent_configuration]
    evidence: { log_before_state: true, retention_days: 2555 }
    note: >-
      A1.6 — target.is_agent_configuration blocks writes to agent charters,
      registration records, tool manifests, skills, hooks, schedules, shell startup
      files and anything on PATH. Symlinks are resolved at write time.

  - name: repository.edit
    version: 1
    owner: platform-engineering
    description: Replace an exact string in a workspace file.
    irreversibility: 1
    side_effects: [workspace contents change]
    idempotent: false
    rollback: "git checkout -- <path>"
    scope: { resource_pattern: "repository:{repository_id}/workspace/{branch}" }
    limits: { per_task: 200, per_agent_hour: 1500, mutation_budget: 200 }
    gates:
      approval: none
      blocked_if: [change_freeze.active, target.is_agent_configuration]
    evidence: { log_before_state: true, retention_days: 2555 }

  - name: branch.commit
    version: 1
    owner: release-engineering
    description: Commit staged changes to a workspace branch.
    irreversibility: 1
    side_effects: [branch history advances]
    idempotent: false
    rollback: "git reset --hard <previous-sha>"
    scope: { resource_pattern: "repository:{repository_id}/workspace/{branch}" }
    limits: { per_task: 20, per_agent_hour: 100, mutation_budget: 20 }
    gates:
      approval: none
      blocked_if: [change_freeze.active, flags.contains_no_verify]
    evidence: { log_before_state: true, retention_days: 2555 }

  - name: record.soft_delete
    version: 1
    owner: data-and-ai
    description: Mark a record deleted with a tombstone. Physical removal is not performed.
    irreversibility: 1
    side_effects: [record hidden from normal queries]
    idempotent: true
    rollback: "UPDATE <table> SET deleted_at = NULL WHERE id = <id>"
    scope:
      resource_pattern: "database:{tenant_id}/{database_name}/{table}"
      requires_referential_check: [database_name, table, record_id]
    limits: { per_task: 50, per_agent_hour: 300, mutation_budget: 50 }
    gates: { approval: none, blocked_if: [change_freeze.active] }
    evidence: { log_before_state: true, retention_days: 2555 }
    note: >-
      A1.4 — this exists so no agent ever needs a hard-delete verb. The reaper
      identity performs physical deletion on a schedule, and no agent may assume it.

  - name: finding.raise
    version: 1
    owner: compliance-and-governance
    description: Record a review, compliance or security finding against a project.
    irreversibility: 1
    side_effects: [finding visible to officers]
    idempotent: true
    rollback: "finding.withdraw <finding_id>"
    scope: { resource_pattern: "project:{project_id}/findings" }
    limits: { per_task: 40, per_agent_hour: 200, mutation_budget: 40 }
    gates: { approval: none, blocked_if: [] }
    evidence: { log_before_state: true,  retention_days: 2555 }

  # ═══════════════════ Tier 2 — reversible, expensive ═══════════════════
  - name: database.migrate
    version: 1
    owner: data-and-ai
    description: Apply a schema migration that has a tested down-migration.
    irreversibility: 2
    side_effects: [schema changes, application may require redeploy]
    idempotent: true
    rollback: "alembic downgrade <revision>   # MUST have been executed in test first"
    scope:
      resource_pattern: "database:{tenant_id}/{database_name}/schema"
      requires_referential_check: [database_name, revision]
    limits: { per_task: 3, per_agent_hour: 10, mutation_budget: 3 }
    gates:
      approval: single
      blocked_if: [change_freeze.active, session.contains_untrusted_content, down_migration.untested]
    evidence: { log_before_state: true, retention_days: 2555 }

  - name: deploy.canary
    version: 1
    owner: platform-engineering
    description: Deploy to a bounded canary slice with declared halt criteria.
    irreversibility: 2
    side_effects: [a percentage of traffic reaches new code]
    idempotent: true
    rollback: "deploy.rollback <previous-release-id>"
    scope:
      resource_pattern: "environment:{environment}/canary"
      max_traffic_percent: 10
    limits: { per_task: 5, per_agent_hour: 20, mutation_budget: 5 }
    gates:
      approval: single
      blocked_if: [change_freeze.active, environment.is_production_without_approval, halt_criteria.undeclared]
    evidence: { log_before_state: true, retention_days: 2555 }

  - name: release.promote
    version: 1
    owner: release-engineering
    description: Promote a release between environments after every gate job succeeded.
    irreversibility: 2
    side_effects: [release advances to the next environment]
    idempotent: true
    rollback: "release.rollback <previous-release-id>"
    scope: { resource_pattern: "release:{release_id}/{environment}" }
    limits: { per_task: 2, per_agent_hour: 10, mutation_budget: 2 }
    gates:
      approval: single
      blocked_if: [change_freeze.active, gate.any_job_not_success, veto.any_active]
    evidence: { log_before_state: true, retention_days: 2555 }
    note: >-
      gate.any_job_not_success covers cancelled, timed-out and unscheduled jobs.
      There is no pass-percentage allowance.

  - name: dependency.pin
    version: 1
    owner: supply-chain
    description: Pin or bump a dependency to an exact commit and record its certification.
    irreversibility: 2
    side_effects: [build inputs change across the repository]
    idempotent: true
    rollback: "dependency.pin <previous-sha>"
    scope: { resource_pattern: "repository:{repository_id}/lockfile" }
    limits: { per_task: 10, per_agent_hour: 40, mutation_budget: 10 }
    gates:
      approval: single
      blocked_if: [change_freeze.active, pin.is_branch_name, certification.missing]
    evidence: { log_before_state: true, retention_days: 2555 }

  - name: credential.revoke
    version: 1
    owner: human-resources
    description: Revoke credentials held by a decommissioned agent.
    irreversibility: 2
    side_effects: [agent can no longer act]
    idempotent: true
    rollback: "identity.reissue <agent_id>   # deliberate re-hire, logged"
    scope: { resource_pattern: "identity:agent/{agent_id}" }
    limits: { per_task: 5, per_agent_hour: 20, mutation_budget: 5 }
    gates: { approval: single, blocked_if: [] }
    evidence: { log_before_state: true, retention_days: 2555 }

  # ═══════ Tier 3 and 4 — registered so they are visible, granted to nobody ═══════
  #
  # These appear here deliberately. A tool that is unregistered is merely unreachable;
  # a tool that is registered with granted_to: [] is unreachable AND auditable, and
  # anyone reviewing the registry can see we considered it and refused.

  - name: repository.force_push
    version: 1
    owner: release-engineering
    description: Overwrite branch history.
    irreversibility: 3
    side_effects: [history is rewritten, other clones diverge]
    idempotent: false
    rollback: null
    scope: { resource_pattern: "repository:{repository_id}/*" }
    limits: { per_task: 0, per_agent_hour: 0, mutation_budget: 0 }
    gates:
      approval: two_person
      blocked_if: [always]
    evidence: { log_before_state: true, retention_days: 2555 }
    granted_to: []
    note: "rollback is null on a Tier 3 tool. That is a design finding, and the reason nobody holds this."

  - name: infrastructure.destroy
    version: 1
    owner: platform-engineering
    description: Destroy infrastructure resources.
    irreversibility: 3
    side_effects: [resources and their data cease to exist]
    idempotent: false
    rollback: null
    scope: { resource_pattern: "environment:{environment}/*" }
    limits: { per_task: 0, per_agent_hour: 0, mutation_budget: 0 }
    gates:
      approval: two_person
      blocked_if: [always]
    evidence: { log_before_state: true, retention_days: 2555 }
    granted_to: []

  - name: email.send
    version: 1
    owner: service-management
    description: Send an email outside the trust boundary.
    irreversibility: 4
    side_effects: [a message leaves the boundary and cannot be recalled]
    idempotent: true
    rollback: null
    scope: { resource_pattern: "messaging:{tenant_id}/outbound" }
    limits: { per_task: 0, per_agent_hour: 0, mutation_budget: 0 }
    gates:
      approval: two_person
      cooling_off_s: 60
      blocked_if: [session.contains_untrusted_content]
    evidence: { log_before_state: true, retention_days: 2555 }
    granted_to: []
    note: "Tier 4 is never automatic, in any environment, at any confidence level."

  - name: repository.make_public
    version: 1
    owner: platform-engineering
    description: Change repository or bucket visibility to public.
    irreversibility: 4
    side_effects: [contents become world-readable and may be indexed immediately]
    idempotent: true
    rollback: null
    scope: { resource_pattern: "repository:{repository_id}/visibility" }
    limits: { per_task: 0, per_agent_hour: 0, mutation_budget: 0 }
    gates:
      approval: two_person
      cooling_off_s: 300
      blocked_if: [always]
    evidence: { log_before_state: true, retention_days: 2555 }
    granted_to: []
    note: "A leaked repository cannot be un-leaked any more than a wire transfer can be un-sent."

  - name: payment.transfer
    version: 1
    owner: finance
    description: Move money.
    irreversibility: 4
    side_effects: [funds leave the platform]
    idempotent: true
    rollback: null
    scope: { resource_pattern: "payments:{tenant_id}/*" }
    limits: { per_task: 0, per_agent_hour: 0, mutation_budget: 0 }
    gates:
      approval: two_person
      cooling_off_s: 300
      blocked_if: [always]
    evidence: { log_before_state: true, retention_days: 2555 }
    granted_to: []
    note: >-
      No agent in this company moves money. Payment work is integration with a
      hosted processor; the transfer itself is always a human act.

# Mapping from irreversibility tier to the gate the policy plane applies.
tier_gates:
  0: { approval: none,       note: "Automatic. Logged. Still counts toward read scope." }
  1: { approval: none,       note: "Automatic, logged, mutation-budgeted." }
  2: { approval: single,     note: "Automatic in canary scope; approval for full rollout. Rollback must exist and be recorded." }
  3: { approval: plan_hash,  note: "Human approval on a plan diff bound to a plan hash. Blocked if the session contains untrusted content." }
  4: { approval: two_person, note: "Two-person rule plus cooling-off. Never automatic, in any environment, at any confidence level." }
