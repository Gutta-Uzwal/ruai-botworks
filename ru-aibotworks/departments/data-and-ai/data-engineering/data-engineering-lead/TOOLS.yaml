# STD-AGENT-001 §10 tool contracts reachable by this agent.
# An unregistered tool is unreachable. An incomplete contract is Tier 3 and denied.
# GENERATED from REGISTRY. Do not hand-edit.

agent: data-engineering-lead
max_tier: 1
egress:
  default: deny
  allowlist: []
  note: Tool-mediated publication counts as egress. A tool that writes somewhere world-readable
    is an outbound channel regardless of what it is called.
forbidden_identities:
- backup-operator
- reaper
- control-plane-operator
granted:
- name: repository.read
  version: 1
  owner: platform-engineering
  description: Read a file from the bound repository.
  irreversibility: 0
  side_effects: []
  idempotent: true
  rollback: none
  scope:
    resource_pattern: repository:{repository_id}/read-only
  limits:
    per_task: 400
    per_agent_hour: 4000
    mutation_budget: 0
  gates:
    approval: none
    blocked_if: []
  evidence:
    log_before_state: true
    retention_days: 2555
- name: repository.search
  version: 1
  owner: platform-engineering
  description: Search file contents in the bound repository.
  irreversibility: 0
  side_effects: []
  idempotent: true
  rollback: none
  scope:
    resource_pattern: repository:{repository_id}/read-only
  limits:
    per_task: 400
    per_agent_hour: 4000
    mutation_budget: 0
  gates:
    approval: none
    blocked_if: []
  evidence:
    log_before_state: true
    retention_days: 2555
- name: observability.read
  version: 1
  owner: site-reliability
  description: Read traces, metrics and the trajectory log.
  irreversibility: 0
  side_effects: []
  idempotent: true
  rollback: none
  scope:
    resource_pattern: observability:{tenant_id}/read-only
  limits:
    per_task: 200
    per_agent_hour: 2000
    mutation_budget: 0
  gates:
    approval: none
    blocked_if: []
  evidence:
    log_before_state: true
    retention_days: 2555
  note: Read only, and the observability store is written under a different principal. No
    agent may alter or delete it (§5 plane 7).
- name: database.query
  version: 1
  owner: data-and-ai
  description: Run a read-only SELECT against a bound database.
  irreversibility: 0
  side_effects: []
  idempotent: true
  rollback: none
  scope:
    resource_pattern: database:{tenant_id}/{database_name}/read-only
    requires_referential_check:
    - database_name
  limits:
    per_task: 100
    per_agent_hour: 1000
    mutation_budget: 0
  gates:
    approval: none
    blocked_if: []
  evidence:
    log_before_state: true
    retention_days: 2555
- name: repository.write
  version: 1
  owner: platform-engineering
  description: Write a file in the agent's workspace branch.
  irreversibility: 1
  side_effects:
  - workspace contents change
  idempotent: true
  rollback: git checkout -- <path>
  scope:
    resource_pattern: repository:{repository_id}/workspace/{branch}
  limits:
    per_task: 100
    per_agent_hour: 800
    mutation_budget: 100
  gates:
    approval: none
    blocked_if:
    - change_freeze.active
    - target.is_agent_configuration
  evidence:
    log_before_state: true
    retention_days: 2555
  note: A1.6 — target.is_agent_configuration blocks writes to agent charters, registration
    records, tool manifests, skills, hooks, schedules, shell startup files and anything on
    PATH. Symlinks are resolved at write time.
- name: repository.edit
  version: 1
  owner: platform-engineering
  description: Replace an exact string in a workspace file.
  irreversibility: 1
  side_effects:
  - workspace contents change
  idempotent: false
  rollback: git checkout -- <path>
  scope:
    resource_pattern: repository:{repository_id}/workspace/{branch}
  limits:
    per_task: 200
    per_agent_hour: 1500
    mutation_budget: 200
  gates:
    approval: none
    blocked_if:
    - change_freeze.active
    - target.is_agent_configuration
  evidence:
    log_before_state: true
    retention_days: 2555
- name: branch.commit
  version: 1
  owner: release-engineering
  description: Commit staged changes to a workspace branch.
  irreversibility: 1
  side_effects:
  - branch history advances
  idempotent: false
  rollback: git reset --hard <previous-sha>
  scope:
    resource_pattern: repository:{repository_id}/workspace/{branch}
  limits:
    per_task: 20
    per_agent_hour: 100
    mutation_budget: 20
  gates:
    approval: none
    blocked_if:
    - change_freeze.active
    - flags.contains_no_verify
  evidence:
    log_before_state: true
    retention_days: 2555
